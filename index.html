<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Custom Typer</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: monospace, sans-serif;
      margin: 0;
      padding: 20px;
      touch-action: manipulation; /* ダブルタップズームの防止 */
    }

    /* 設定エリア */
    #setup-area {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 14px;
    }

    textarea, input {
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 10px;
      border-radius: 4px;
      font-size: 16px;
    }

    button {
      background-color: #fff;
      color: #000;
      border: none;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
    }

    button:hover {
      background-color: #ccc;
    }

    /* タイピング表示エリア */
    #display-area {
      display: none;
      white-space: pre-wrap; /* 改行やスペースを維持 */
      word-break: break-all;
      min-height: 100vh;
      outline: none;
      cursor: pointer; /* タップできることがわかりやすいように */
      -webkit-user-select: none; /* タップ時に青くテキスト選択されないようにする */
      user-select: none;
    }

    /* 細いカーソルの点滅アニメーション */
    .cursor {
      display: inline-block;
      width: 2px; /* 細いバー */
      height: 1.1em;
      background-color: #fff;
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* iPad/スマホ用の設定に戻るボタン（画面左上にうっすら表示） */
    #back-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      opacity: 0.3;
      background: #333;
      color: #fff;
      border: 1px solid #666;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 100;
      display: none;
    }
    #back-btn:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- 設定画面 -->
  <div id="setup-area">
    <h2>カスタムタイパー設定</h2>
    <label>
      表示したい文字列（事前入力）:
      <textarea id="target-text" rows="8" placeholder="ここに表示させたいテキストを入力してください..."></textarea>
    </label>
    <label>
      文字サイズ (px):
      <input type="number" id="font-size" value="24" min="10" max="100">
    </label>
    <button id="start-btn">スタート</button>
  </div>

  <!-- タイピング実行画面 -->
  <button id="back-btn">設定に戻る</button>
  <div id="display-area" tabindex="0">
    <span id="typed-text"></span><span class="cursor"></span>
  </div>

  <script>
    const setupArea = document.getElementById('setup-area');
    const displayArea = document.getElementById('display-area');
    const targetTextInput = document.getElementById('target-text');
    const fontSizeInput = document.getElementById('font-size');
    const startBtn = document.getElementById('start-btn');
    const backBtn = document.getElementById('back-btn');
    const typedTextSpan = document.getElementById('typed-text');

    let fullText = '';
    let currentIndex = 0;
    let isTypingMode = false;

    // 1文字進める共通処理
    function typeNextChar() {
      if (currentIndex < fullText.length) {
        typedTextSpan.textContent += fullText[currentIndex];
        currentIndex++;
        window.scrollTo(0, document.body.scrollHeight);
      }
    }

    // 設定画面に戻る処理
    function resetToSetup() {
      isTypingMode = false;
      displayArea.style.display = 'none';
      backBtn.style.display = 'none';
      setupArea.style.display = 'flex';
      typedTextSpan.textContent = '';
      currentIndex = 0;
    }

    // スタートボタンを押した時の処理
    startBtn.addEventListener('click', () => {
      fullText = targetTextInput.value;
      const fontSize = fontSizeInput.value + 'px';

      if (!fullText) {
        alert('文字列を入力してください。');
        return;
      }

      displayArea.style.fontSize = fontSize;
      setupArea.style.display = 'none';
      displayArea.style.display = 'block';
      backBtn.style.display = 'block';
      displayArea.focus();
      
      isTypingMode = true;
    });

    // キーボード入力時の処理
    window.addEventListener('keydown', (e) => {
      if (!isTypingMode) return;

      if (e.key === 'Escape') {
        resetToSetup();
        return;
      }

      if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) {
        return;
      }

      typeNextChar();
    });

    // 画面タップ/クリック時の処理 (iPad・スマホ用)
    displayArea.addEventListener('pointerdown', (e) => {
      if (!isTypingMode) return;
      
      // 「設定に戻る」ボタンを押した場合はタイピングを進めない
      if (e.target === backBtn) return;

      typeNextChar();
    });

    // 設定に戻るボタンのタップ処理
    backBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // タップイベントの連動を防止
      resetToSetup();
    });
  </script>
</body>
</html>
